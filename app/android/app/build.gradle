apply plugin: 'com.android.application'

// 릴리스 서명: android/keystore.properties + 키스토어 파일 (둘 다 git에 올리지 않음)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.chwidragon.lumencalc"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId = "com.chwidragon.lumencalc"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 58
        versionName = "1.1.8" // lumencalc.html의 APP.version과 맞춤
    }
    androidResources {
        // 패키징에서 뺄 assets 파일 (기본 규칙 + 점으로 시작하는 파일)
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }
    // -PwithArt: 캐릭터 그림 앱 아이콘(src/art/res, git에 없음)을 release 리소스에 겹침 (릴리즈 APK·AAB 전용)
    if (project.hasProperty('withArt')) {
        sourceSets { release { res.srcDirs += 'src/art/res' } }
    }
    buildTypes {
        release {
            // R8 전체 모드: 쓰지 않는 코드·리소스를 빼고 최적화 · 난독화 · 클래스 리패키징 (규칙은 proguard-rules.pro,
            // 리소스 축소 최적화는 gradle.properties의 android.r8.optimizedResourceShrinking)
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// 버전 번호는 ../variables.gradle (Capacitor 템플릿). 테스트 코드가 없어 테스트용 의존성은 넣지 않음
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
    implementation "androidx.core:core-splashscreen:${rootProject.ext.coreSplashScreenVersion}"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
