<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!--
================================================================================
 루멘콘덴서 계산기 (lumencalc.html) — 개발·APK 패키징 안내
================================================================================
 오프라인 대전 카드게임 '루멘콘덴서'를 두 사람이 폰 한 대로 함께 쓰는 체력·토큰 계산기.
 HTML 한 파일로 동작하며, 이 파일 그대로 APK(WebView/Capacitor)에 넣어 쓰도록 만들었다.
 아래는 사용자 요청으로 정해진 동작들이다. 수정·패키징할 때 바꾸지 말 것.

 ■ 화면 방향 (가장 중요)
  - 이 앱은 "세로 전용"이다. 가로 모드는 따로 없다.
  - 폰을 옆으로 눕혀서(좌우로 길게) 테이블 가운데에 두고 두 사람이 같이 본다.
  - 화면(뷰포트)이 세로면 CSS가 .app 전체를 90° 돌려 가로 레이아웃으로 그린다.
      폰의 윗부분 = 앱의 왼쪽(1P), 폰의 아랫부분 = 앱의 오른쪽(2P).
      → 폰 윗부분이 왼쪽으로 가게(반시계 방향으로) 눕히면 정방향.
    구현: CSS `@media (orientation: portrait) { .app { transform: rotate(90deg) … } }`
          화면 크기는 CSS 100dvw/100dvh로 바로 따라감(자바스크립트로 크기를 재지 않음 → 이벤트를 놓쳐도 틀어지지 않음).
  - 뷰포트가 원래 가로(PC 미리보기, 자동 회전된 폰 브라우저)면 회전하지 않는다.
  - 아티팩트·HTML을 폰 브라우저로 볼 때도 세로로 들고 있으면 APK와 똑같이 회전된 화면이 나온다.
    (폰 자동 회전을 끄고 확인하면 APK와 완전히 같은 조건)
  - [APK 필수] AndroidManifest의 Activity에 android:screenOrientation="portrait".
    OS가 화면을 돌리면 CSS 회전과 겹쳐서 화면이 틀어진다.
  - [APK 권장] 노치 대응: styles.xml windowLayoutInDisplayCutoutMode = shortEdges.
    안전 영역(env(safe-area-inset-*))은 회전 방향에 맞춰 --safe-* 변수로 다시 매핑해 둠.

 ■ APK 체크리스트 (Digimon Memory Checker APK와 같은 구성)
  - Capacitor 등 WebView에 이 파일을 index.html로 넣는다. assets/ 폴더도 같이 복사.
  - 세로 고정(위 참고), 화면 꺼짐 방지: JS Wake Lock + MainActivity에 FLAG_KEEP_SCREEN_ON 권장.
  - 진동(navigator.vibrate) 사용 → VIBRATE 권한.
  - 저장은 localStorage 키 'lumencalc.v6' 하나(상태 전체 JSON). WebView의 DOM Storage 켜기.
  - 글꼴은 Google Fonts(인터넷 필요). 오프라인이면 시스템 글꼴로 대체되어도 동작에는 문제 없음.
    완전 오프라인 디자인을 원하면 Black Han Sans / Chakra Petch / IBM Plex Sans KR을 로컬 파일로 포함.
  - 새 버전을 낼 때 스크립트의 APP.version / APP.build 를 올린다(설정 > 버전 탭에 표시됨).

 ■ 화면 구성
  1) 캐릭터 선택: 가운데 마름모 칸(역삼각형 배치). 첫 터치 = 1P, 두 번째 터치 = 2P.
     제목 'CHARACTER SELECT'. 아래쪽에 지금 고를 차례를 크게 '1P SELECT'/'2P SELECT'로 표시
     (1P 파랑 · 2P 빨강 그라데이션 테두리).
     둘 다 고른 뒤: 고른 캐릭터 칸을 다시 누르면 그쪽 선택 취소(미러전이면 2P부터), 다른 칸은 무반응(안내창 없음).
     좌우 아래 캐릭터를 눌러도 그쪽만 해제. 다음 칸 터치가 빈 쪽을 채움. 둘 다 고르면 게임 시작 옆에 초기화(↻ 아이콘) 버튼 = 1P·2P 모두 해제.
     앱 실행 · 캐릭터 선택 버튼 · ALL DELETE로 선택 화면에 오면 항상 빈 상태에서 시작.
     좌우 아래 모서리에 선택한 캐릭터의 전신(반신처럼 잘림) + 이름. 둘 다 고르면 'GAME START'.
     계산기 화면의 경기 시간·10초 타이머에는 안내 문구 없이 숫자만 표시.
     가운데 열은 양쪽과 같은 줄(CSS subgrid)을 씀: 경기 시간 = 툴바 바로 아래(체력 숫자 줄),
     10초 타이머 = FP 칸과 같은 높이(데미지·FP 줄), TURN = 특성·토큰 줄 아래.
     오른쪽 위: 로그 / 설정 버튼. 캐릭터가 늘어날 것을 대비해 빈 칸을 항상 3개 이상 남김.
  2) 계산기: 왼쪽 1P / 오른쪽 2P 좌우 대칭, 가운데에 툴바·경기 시간·10초 타이머·턴.

 ■ 계산기 규칙
  - 체력 버튼: −300 −400 −500 −600 / +100 +200 −100 −200. 체력은 0~최대 사이.
  - 체력 옆 합계: 1.6초 안에 같은 방향으로 연달아 누르면 합계를 잠깐 표시.
  - 손패 한도: 체력 구간 5000~4001 / 4000~3001 / 3000~2001 / 2000~1001 / 1000 이하.
    기본 6/7/8/9/9, 리타 6/7/8/9/10, 키메라 5/5/5/6/6(특성 ON이면 +1), CMYK 10×5.
    시작 체력 기본 5000, 무영 4500, 핀프 5500.
  - FP: 데미지 버튼 옆 + / −. 가운데 현재 FP 숫자를 탭하면 0으로 초기화(되돌리기 가능). 10초 타이머: 탭=10초 시작(다시 탭=재시작), 길게=정지. 효과음 없음.
  - 경기 시간: 탭=시작/일시정지, 길게=초기화. 남은 1분부터 노란색, 10초부터 빨간색. 설정에서 분 단위로 바꾸면 즉시 적용.
  - TURN: 탭 +1, 길게 −1.
  - 서든데스: 양쪽 체력이 모두 0이면 가운데(10초 타이머 자리)에 '서든데스' 버튼이 나타남.
    탭 → 양쪽 체력 1000 · FP 0, 버튼 사라짐. 되돌리기로 취소 가능(버튼 다시 나타남).
  - 1초(MERGE_MS) 안에 같은 종류(같은 플레이어의 피해/회복/FP/같은 토큰)를 이어 누르면
    되돌리기·로그에서 한 번으로 묶는다.
  - 특성 마크: 탭하면 밝게(ON)/어둡게(OFF). 강조 효과는 은은하게(움직이는 효과 금지).
  - 토큰 칸은 토큰이 있는 캐릭터만 표시. 토큰 색 = 캐릭터 상징색. 점 배치는 최대치 기준으로 고정.
    델피 3/3 · 울프 0/5(5개 강조, 5개에서 특성 ON → 모두 사용하고 강조는 유지,
    특성 OFF나 토큰 개수가 바뀌면 강조 꺼짐) · 비올라 0/3(1개 이상 강조)
    레브 0/6 · 린 0/∞ · 요한 3/5 · 이제벨 0/∞ · 키메라 0/9(9개 강조) · 무영 3/5 · 핀프 4/4(0개 강조) · CMYK 10/10
    숫자·마름모 탭 → 0으로 초기화: 울프, 비올라, 린, 이제벨, 무영.
  - 무영: 체력이 2500 이하가 되면 특성 자동 ON, 2500 초과로 회복하면 자동 OFF.
  - 타오: 양(흰)·음(검) 토큰 각 0/4. 둘 다 4개 → 조화(특성) ON, 한쪽이라도 2개 이하 → OFF.
    조화 아닐 때 더 많은 쪽 강조. 조화 중에는 양/음 줄을 눌러 하나를 선택.
    조화 중 특성 마크 탭 → 토큰 모두 제거(조화 OFF).
  - 리타: 가디언·어쌔신·팔라딘 중 하나 선언(가운데 위/왼쪽 아래/오른쪽 아래, 대칭).
    특성(빛의 루멘) ON → 세 상태 모두 적용 + 칸 강조, 그 상태에서도 하나를 선언(흰 테두리).
  - 마름모 버튼은 주변 네모 전체가 터치 영역(.dbtn). 예외: 선택 화면 칸, 리타 상태(서로 맞물림).

 ■ 로그 (Digimon Memory Checker 로그와 같은 구성)
  - GAME LOG 창: 시각 | 색 태그(묶인 입력은 누른 값 나열) | 결과값. 1P 파랑 / 2P 분홍.
  - 로그 이름 = 게임 시작 시각(월일시분). 새 게임 때 자동 보관(최근 10개), 탭으로 보기.
  - 로그 이름을 1초 누르면 그 게임의 마지막 상황을 불러와 이어하기.
  - 되돌리기한 행동의 로그 줄은 바로 지우지 않고 흐리게(취소선 + '되돌림') 남김.
    다음에 새 기록(피해·FP·토큰·턴 등 무엇이든)이 생기면 그때 되돌린 줄이 모두 지워짐.
  - ALL DELETE 1초 → 모든 로그 삭제 + 게임 초기화(선택 화면).
  - 앱을 다시 열면: 진행 중이던 게임은 로그에 보관하고 캐릭터 선택부터 시작(1P·2P 선택도 비움).

 ■ 캐릭터 데이터 · 이미지
  - 스크립트의 CHARACTERS 목록에 한 줄 추가하면 캐릭터가 늘어남(필드 설명은 목록 위 주석).
  - 이미지는 assets/characters/{id}_{body|face|trait}.png(.webp) — 없으면 대체 그림. 자세한 건 그 폴더 README.txt.

 ■ 레이아웃 단위
  - 크기는 --u = min(1cqh, .45cqw) 기준(화면 비율이 달라도 겹치지 않게). 새 요소도 --u로 크기를 줄 것.
================================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0A0E1A;
    --surface: #131A2B;
    --surface-2: #1A2238;
    --surface-3: #242E4A;
    --line: #2A3452;
    --text: #EEF1FA;
    --muted: #8790AE;
    --faint: #3E4868;
    --p1: #4DA3FF;
    --p2: #FF5C7A;
    --dmg: #FF6B61;
    --heal: #3DCB8A;
    --lumen: #FFC247;
    --u: min(1cqh, .45cqw);
    --cut: calc(1.6 * var(--u));
    --font-display: "Black Han Sans", "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
    --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --font-num: "Chakra Petch", "IBM Plex Sans KR", ui-monospace, monospace;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  button {
    font: inherit;
    color: inherit;
    border: 0;
    background: none;
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 2px solid var(--lumen); outline-offset: 2px; }
  svg { display: block; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  .app {
    position: relative;
    height: 100%;
    container-type: size;
    background:
      repeating-linear-gradient(45deg, transparent 0 calc(5.4 * var(--u)), rgba(255,255,255,.022) calc(5.4 * var(--u)) calc(calc(5.4 * var(--u)) + 1px)),
      repeating-linear-gradient(-45deg, transparent 0 calc(5.4 * var(--u)), rgba(255,255,255,.022) calc(5.4 * var(--u)) calc(calc(5.4 * var(--u)) + 1px)),
      radial-gradient(80% 70% at 50% 45%, #111830 0%, var(--bg) 75%);
  }
  /* 안전 영역(노치·상태바) — 가로 화면일 때 좌우만. 위아래는 페이지 여백이 처리 */
  .app {
    --safe-t: 0px;
    --safe-b: 0px;
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  /* 세로로 고정된 폰(APK)을 옆으로 눕혀 쓰는 앱: 화면이 세로면 앱 전체를 90° 돌려 가로로 그림
     (Digimon Memory Checker와 같은 방식 · 폰 윗부분이 앱의 왼쪽으로 감) */
  @media (orientation: portrait) {
    .app {
      position: fixed;
      top: 0;
      /* 화면 크기는 CSS 단위로 바로 따름(dvw/dvh: 브라우저 주소창·내비게이션 바 변화 반영). 구형 브라우저는 vw/vh */
      left: 100vw;
      left: 100dvw;
      width: 100vh;
      width: 100dvh;
      height: 100vw;
      height: 100dvw;
      transform-origin: 0 0;
      transform: rotate(90deg);
      /* 기기 가장자리 → 앱 가장자리: 위→왼쪽, 오른쪽→위, 아래→오른쪽, 왼쪽→아래 */
      --safe-l: env(safe-area-inset-top, 0px);
      --safe-t: env(safe-area-inset-right, 0px);
      --safe-r: env(safe-area-inset-bottom, 0px);
      --safe-b: env(safe-area-inset-left, 0px);
    }
  }
  .screen { position: absolute; inset: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l); }
  .p1 { --pc: var(--p1); }
  .p2 { --pc: var(--p2); }
  .num { font-family: var(--font-num); font-weight: 700; font-variant-numeric: tabular-nums; }

  /* 마름모 공통 */
  .dia { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .chamfer {
    clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut));
  }
  .ptag {
    display: inline-flex;
    align-items: center;
    gap: .5em;
    font-family: var(--font-num);
    font-weight: 700;
    font-size: max(10px, calc(2.6 * var(--u)));
    letter-spacing: .12em;
    color: var(--pc);
  }
  .ptag::before {
    content: "";
    width: .7em;
    height: .7em;
    background: var(--pc);
    transform: rotate(45deg);
  }

  /* 이미지 + 대체 그림 */
  .art { position: relative; display: grid; place-items: center; overflow: hidden; }
  .art > * { grid-area: 1 / 1; }
  .art > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .art.contain > img { object-fit: contain; object-position: bottom; }
  .face-fb {
    --cc: #888;
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    align-content: center;
    gap: calc(.4 * var(--u));
    background: radial-gradient(80% 80% at 50% 30%, color-mix(in srgb, var(--cc) 70%, #fff) 0%, var(--cc) 40%, color-mix(in srgb, var(--cc) 35%, #05070F) 100%);
    color: rgba(8, 10, 20, .85);
    font-family: var(--font-display);
    text-align: center;
  }

  /* =================== 캐릭터 선택 =================== */
  .select { overflow: hidden; }
  .fighter {
    --cc: var(--faint);
    position: absolute;
    top: 0;
    bottom: 0;
    width: 34cqw;
    overflow: hidden;
    display: block;
    text-align: left;
  }
  .fighter.p1 { left: 0; }
  .fighter.p2 { right: 0; }
  .fighter .glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(75% 60% at 18% 88%, color-mix(in srgb, var(--cc) 34%, transparent), transparent 72%);
  }
  .fighter.p2 .glow { background: radial-gradient(75% 60% at 82% 88%, color-mix(in srgb, var(--cc) 34%, transparent), transparent 72%); }
  .fighter.empty .glow { background: radial-gradient(70% 55% at 18% 90%, color-mix(in srgb, var(--pc) 14%, transparent), transparent 70%); }
  .fighter.p2.empty .glow { background: radial-gradient(70% 55% at 82% 90%, color-mix(in srgb, var(--pc) 14%, transparent), transparent 70%); }
  .fighter .bigdia {
    position: absolute;
    bottom: -calc(30 * var(--u));
    width: calc(90 * var(--u));
    height: calc(90 * var(--u));
    rotate: 45deg;
    border: 1px solid color-mix(in srgb, var(--cc) 40%, transparent);
    background: linear-gradient(135deg, color-mix(in srgb, var(--cc) 12%, transparent), transparent 60%);
  }
  .fighter.p1 .bigdia { left: -calc(40 * var(--u)); }
  .fighter.p2 .bigdia { right: -calc(40 * var(--u)); }
  .fighter .bigdia::after {
    content: "";
    position: absolute;
    inset: 10%;
    border: 1px solid color-mix(in srgb, var(--cc) 22%, transparent);
  }
  /* 전신을 크게 키워 아래를 화면 밖으로 → 반신처럼 보이게 */
  .fighter .body {
    position: absolute;
    bottom: -80cqh;
    height: 150cqh;
    width: 30cqw;
    filter: drop-shadow(0 0 calc(3 * var(--u)) color-mix(in srgb, var(--cc) 50%, transparent));
  }
  .fighter.p1 .body { left: -4cqw; }
  .fighter.p2 .body { right: -4cqw; }
  .fighter.p2 .body .sil { transform: scaleX(-1); }
  .fighter .body .sil { height: 100%; width: 100%; }
  .fighter.empty .body { filter: none; opacity: .22; }
  .fighter .plate {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: calc(10 * var(--u)) 3cqw calc(5 * var(--u));
    background: linear-gradient(transparent, rgba(6, 8, 16, .9) 55%);
    display: grid;
    gap: calc(1 * var(--u));
  }
  .fighter.p2 .plate { justify-items: end; text-align: right; }
  .fighter .name {
    font-family: var(--font-display);
    font-size: max(18px, calc(7.6 * var(--u)));
    line-height: 1.05;
    word-break: keep-all;
    text-wrap: balance;
  }
  .fighter.empty .name { color: var(--muted); font-size: max(14px, calc(4.4 * var(--u))); }
  .fighter.next .ptag { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  .pickcol {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    padding: calc(3.4 * var(--u)) 0 calc(3 * var(--u));
    gap: calc(1 * var(--u));
    pointer-events: none;
  }
  /* 마름모 모양만 눌리고, 빈 곳은 뒤의 전신(다시 고르기)으로 통과 */
  .pickcol button { pointer-events: auto; }
  .pickhead { text-align: center; }
  .seltools {
    position: absolute;
    top: calc(2.6 * var(--u));
    right: max(16px, calc(3 * var(--u)));
    z-index: 2;
    display: flex;
    gap: 1px;
    background: var(--line);
    --cut: calc(1.2 * var(--u));
  }
  .seltools button {
    width: calc(9 * var(--u));
    height: calc(8.4 * var(--u));
    min-width: 32px;
    min-height: 30px;
    display: grid;
    place-items: center;
    background: var(--surface);
    color: var(--muted);
  }
  .seltools button svg { width: 48%; height: 48%; }
  .seltools button:active { background: var(--surface-2); color: var(--text); }
  .pickhead h1 {
    margin: 0;
    font-family: var(--font-num);
    font-weight: 700;
    font-size: max(15px, calc(4.6 * var(--u)));
    letter-spacing: .18em;
  }

  /* 마름모 로스터: 역삼각형 (윗줄이 가장 길고 한 줄 내려갈 때마다 하나씩 줄어듦) */
  .roster {
    --d: min(calc((92cqw - 30px) / var(--w)), 26cqh);
    display: grid;
    grid-template-columns: repeat(var(--cols), calc(var(--d) / 2));
    grid-auto-rows: calc(var(--d) / 2);
    column-gap: calc(.5 * var(--u));
    row-gap: calc(.9 * var(--u));
    justify-content: center;
    align-content: center;
    min-height: 0;
    overflow: hidden;
    padding: calc(.6 * var(--u)) 0;
  }
  .slot {
    --ring: var(--line);
    grid-column: span 2;
    grid-row: span 2;
    padding: calc(.45 * var(--u));
    background: var(--ring);
    display: grid;
  }
  .slot .art { width: 100%; height: 100%; }
  .slot .face-fb { font-size: calc(5.4 * var(--u)); line-height: 1; }
  .slot .face-fb small { font-family: var(--font-body); font-weight: 700; font-size: max(10px, calc(2.6 * var(--u))); line-height: 1.15; max-width: 60%; word-break: keep-all; color: rgba(8, 10, 20, .75); }
  .slot.empty { --ring: rgba(42, 52, 82, .55); }
  .slot.empty .art { background: rgba(19, 26, 43, .7); }
  .slot.s1 { --ring: var(--p1); }
  .slot.s2 { --ring: var(--p2); }
  .slot.s1.s2 { --ring: linear-gradient(90deg, var(--p1) 50%, var(--p2) 50%); }
  .slot.s1 .art, .slot.s2 .art { filter: brightness(1.12); }
  button.slot:active .art { filter: brightness(1.25); }

  .startbar { display: grid; place-items: center; min-height: calc(10 * var(--u)); position: relative; z-index: 1; }
  /* 게임 시작(가운데 고정) 오른쪽 옆의 작은 초기화 버튼 */
  .startwrap { position: relative; display: grid; place-items: center; }
  .pickclear {
    position: absolute;
    left: calc(100% + 2.4 * var(--u));
    top: 50%;
    translate: 0 -50%;
    display: grid; place-items: center;
    width: calc(9 * var(--u)); height: calc(9 * var(--u)); min-width: 34px; min-height: 34px;
    --cut: calc(1.4 * var(--u));
    background: var(--surface); border: 1px solid var(--line);
    color: var(--muted);
  }
  .pickclear svg { width: 50%; height: 50%; }
  .pickclear:active { background: var(--surface-2); color: var(--text); }
  /* 지금 고르는 쪽 강조: 크게 "1P SELECT" + 파랑(1P)/빨강(2P) 그라데이션 테두리 */
  .selbadge {
    --poly: polygon(calc(3.2 * var(--u)) 0, calc(100% - calc(3.2 * var(--u))) 0, 100% 50%, calc(100% - calc(3.2 * var(--u))) 100%, calc(3.2 * var(--u)) 100%, 0 50%);
    position: relative;
    display: flex; align-items: baseline; gap: calc(1.6 * var(--u));
    padding: calc(1.7 * var(--u)) 5.5cqw;
    font-family: var(--font-num); font-weight: 700; line-height: 1;
    font-size: max(16px, calc(5.4 * var(--u))); letter-spacing: .14em;
    color: var(--text);
    clip-path: var(--poly);
    background: var(--sg);
    animation: pop .25s ease-out;
  }
  .selbadge::before {
    content: ''; position: absolute; inset: 2px;
    clip-path: var(--poly);
    background: linear-gradient(180deg, color-mix(in srgb, var(--sc) 24%, var(--surface)), var(--bg));
  }
  .selbadge > * { position: relative; }
  .selbadge b { color: var(--sc); }
  .selbadge.p1 { --sg: linear-gradient(90deg, #2A6BFF, #7FD4FF); --sc: #5DB2FF; }
  .selbadge.p2 { --sg: linear-gradient(90deg, #FF2440, #FF8A6B); --sc: #FF4D5E; }
  .gamestart {
    font-family: var(--font-num);
    font-weight: 700;
    font-size: max(16px, calc(5 * var(--u)));
    letter-spacing: .14em;
    padding: calc(1.8 * var(--u)) 6cqw;
    background: linear-gradient(180deg, #FFD778, var(--lumen));
    color: #1A1300;
    clip-path: polygon(calc(3.2 * var(--u)) 0, calc(100% - calc(3.2 * var(--u))) 0, 100% 50%, calc(100% - calc(3.2 * var(--u))) 100%, calc(3.2 * var(--u)) 100%, 0 50%);
    animation: pop .25s ease-out, glowpulse 1.8s ease-in-out .25s infinite;
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  @keyframes glowpulse { 50% { filter: brightness(1.12); } }

  /* =================== 계산기 =================== */
  /* 줄: 이름판 / 체력 숫자 / 체력 막대 / 데미지·FP / 특성·토큰 — 양쪽과 가운데 열이 같은 줄을 공유 */
  .game {
    display: grid;
    grid-template-columns: minmax(0, 1fr) calc(40 * var(--u)) minmax(0, 1fr);
    grid-template-rows: auto auto auto minmax(0, 1fr) auto;
    column-gap: calc(3 * var(--u));
    row-gap: calc(1.8 * var(--u));
    padding: calc(3 * var(--u)) max(16px, calc(4 * var(--u)));
    box-sizing: border-box;
  }
  .side {
    min-width: 0;
    grid-row: 1 / -1;
    display: grid;
    grid-template-rows: subgrid;
  }
  .side .plate {
    display: flex;
    align-items: center;
    gap: 1.2cqw;
    height: calc(11 * var(--u));
    flex: none;
  }
  .side.p2 .plate { flex-direction: row-reverse; }
  .plate .facering {
    flex: none;
    width: calc(10 * var(--u));
    height: calc(10 * var(--u));
    padding: calc(.4 * var(--u));
    box-sizing: border-box;
    background: var(--pc);
    display: grid;
  }
  .plate .facering .face-fb { font-size: calc(3.6 * var(--u)); }
  .plate .who { flex: 1; min-width: 0; display: grid; gap: calc(.5 * var(--u)); }
  .side.p2 .plate .who { justify-items: end; }
  .plate .line { display: flex; align-items: center; gap: .8cqw; }
  .side.p2 .plate .line { flex-direction: row-reverse; }
  .plate .cname {
    font-family: var(--font-display);
    font-size: max(15px, calc(4.8 * var(--u)));
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badge.ko {
    font-size: max(9px, calc(2.2 * var(--u)));
    font-weight: 700;
    padding: .15em .6em;
    background: var(--dmg);
    color: #fff;
  }
  .hand {
    flex: none;
    display: flex;
    align-items: center;
    gap: .8cqw;
  }
  .side.p2 .hand { flex-direction: row-reverse; }
  .side.p1 .hand { margin-right: calc(2 * var(--u)); }
  .side.p2 .hand { margin-left: calc(2 * var(--u)); }
  .hand .lbl { font-size: max(9px, calc(2.2 * var(--u))); color: var(--muted); letter-spacing: .06em; writing-mode: horizontal-tb; }
  .hand .dia {
    width: calc(11 * var(--u));
    height: calc(11 * var(--u));
    min-width: 38px;
    min-height: 38px;
    display: grid;
    place-items: center;
    background: var(--surface-2);
    box-shadow: inset 0 0 0 1px var(--line);
    font-size: max(18px, calc(6.2 * var(--u)));
    line-height: 1;
  }

  .hpline {
    position: relative;
    display: flex;
    align-items: baseline;
    gap: 1cqw;
    flex: none;
  }
  .side.p2 .hpline { flex-direction: row-reverse; }
  .hp { font-size: calc(13 * var(--u)); line-height: .85; letter-spacing: -.01em; }
  .hpmax { font-size: max(11px, calc(3 * var(--u))); color: var(--muted); }
  .side.ko .hp { color: var(--dmg); }
  .burst {
    position: absolute;
    bottom: calc(.4 * var(--u));
    display: flex;
    align-items: baseline;
    gap: .6cqw;
    opacity: 0;
    transition: opacity .4s;
    pointer-events: none;
  }
  .side.p1 .burst { right: 0; }
  .side.p2 .burst { left: 0; flex-direction: row-reverse; }
  .burst.show { opacity: 1; transition: none; }
  .burst .amt { font-size: max(16px, calc(5.6 * var(--u))); }
  .burst.dmg .amt { color: var(--dmg); }
  .burst.heal .amt { color: var(--heal); }

  .bar {
    position: relative;
    height: calc(2.8 * var(--u));
    min-height: 9px;
    flex: none;
    background: var(--surface-2);
    overflow: hidden;
  }
  .side.p1 .bar { clip-path: polygon(0 0, 100% 0, calc(100% - calc(2.8 * var(--u))) 100%, 0 100%); }
  .side.p2 .bar { clip-path: polygon(0 0, 100% 0, 100% 100%, calc(2.8 * var(--u)) 100%); }
  .bar .ghost, .bar .fill { position: absolute; top: 0; bottom: 0; }
  .side.p1 .bar .ghost, .side.p1 .bar .fill { left: 0; }
  .side.p2 .bar .ghost, .side.p2 .bar .fill { right: 0; }
  .bar .ghost { background: #fff; opacity: .55; transition: width .6s ease .45s; }
  .bar .fill { background: linear-gradient(180deg, color-mix(in srgb, var(--pc) 70%, #fff), var(--pc)); transition: width .15s ease-out; }
  .bar.low .fill { background: linear-gradient(180deg, #FFE08A, var(--lumen)); }
  .bar.crit .fill { background: linear-gradient(180deg, #FF9A93, var(--dmg)); }

  .ctrl {
    flex: 1;
    min-height: 0;
    margin-top: calc(.6 * var(--u));
    display: grid;
    grid-template-columns: minmax(0, 1fr) calc(12 * var(--u));
    gap: calc(1.4 * var(--u));
  }
  .side.p2 .ctrl { grid-template-columns: calc(12 * var(--u)) minmax(0, 1fr); }
  .quick {
    min-height: 0;
    min-width: 0;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: calc(1.4 * var(--u));
  }
  .q {
    font-size: max(14px, calc(4.4 * var(--u)));
    background: linear-gradient(180deg, color-mix(in srgb, var(--dmg) 16%, var(--surface)), color-mix(in srgb, var(--dmg) 8%, var(--surface)));
    color: var(--dmg);
    transition: filter .08s, transform .08s;
  }
  .q.heal {
    background: linear-gradient(180deg, color-mix(in srgb, var(--heal) 15%, var(--surface)), color-mix(in srgb, var(--heal) 7%, var(--surface)));
    color: var(--heal);
  }
  .q:active { transform: scale(.95); filter: brightness(1.5); }

  /* 마름모 버튼: 마름모는 그림(::before)으로만 그리고, 터치 영역은 버튼 네모 전체 */
  .dbtn {
    --ds: calc(9 * var(--u));
    position: relative;
    display: grid;
    place-items: center;
    background: none;
    min-width: 0;
    min-height: 0;
  }
  .dbtn::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--ds);
    height: var(--ds);
    transform: translate(-50%, -50%);
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
    background: var(--surface-3);
    transition: background .1s;
  }
  .dbtn:active::before { background: var(--faint); }
  .dbtn svg { position: relative; width: calc(var(--ds) * .42); height: calc(var(--ds) * .42); }

  .fp {
    min-height: 0;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr);
    justify-items: stretch;
    background: var(--surface);
  }
  .fp .dbtn { --ds: calc(9 * var(--u)); }
  /* 현재 FP 숫자 = 탭하면 0으로 초기화 (칸 너비 전체가 터치 영역) */
  .fp .val { justify-self: stretch; text-align: center; padding: calc(1 * var(--u)) 0; cursor: pointer; }
  .fp .val { font-size: max(16px, calc(5.8 * var(--u))); line-height: 1; }
  .fp .val:active { background: var(--surface-2); }
  .fp .val.pos { color: var(--lumen); }
  .fp .val.neg { color: var(--dmg); }

  /* 하단: 특성 마크 · 토큰 (FP 아래까지 전체 폭) */
  .extras {
    display: grid;
    grid-template-columns: calc(23 * var(--u)) minmax(0, 1fr);
    gap: calc(1.4 * var(--u));
    height: calc(28 * var(--u));
    flex: none;
  }
  .side.p2 .extras { grid-template-columns: minmax(0, 1fr) calc(23 * var(--u)); }
  /* 특성만 있는 캐릭터: 데미지 칸 가운데 줄에 맞춤 */
  .extras.solo { grid-template-columns: minmax(0, 1fr) calc(12 * var(--u)); }
  .side.p2 .extras.solo { grid-template-columns: calc(12 * var(--u)) minmax(0, 1fr); }
  .extras.solo .trait { width: calc(23 * var(--u)); justify-self: center; }
  .side.p2 .extras.solo .trait { grid-column: 2; }
  .trait {
    display: grid;
    place-items: center;
    background: none;
    min-width: 0;
  }
  .trait .mark {
    width: calc(22 * var(--u));
    height: calc(22 * var(--u));
    padding: calc(.6 * var(--u));
    box-sizing: border-box;
    background: var(--faint);
    display: grid;
    transition: filter .2s, background .2s;
    filter: grayscale(.85) brightness(.45);
  }
  .trait .mark .art { width: 100%; height: 100%; }
  .trait .spark { width: 100%; height: 100%; display: grid; place-items: center; background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--cc) 55%, #0A0E1A), #0A0E1A 80%); }
  .trait .spark svg { width: 58%; height: 58%; color: var(--cc); }
  .trait.on .mark { filter: none; background: var(--cc); box-shadow: 0 0 calc(3 * var(--u)) color-mix(in srgb, var(--cc) 60%, transparent); }

  .counter {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: calc(1.4 * var(--u));
    padding: 0;
    background: var(--surface);
    min-width: 0;
    transition: background .2s;
  }
  .counter .mid { display: grid; justify-items: center; align-content: center; gap: calc(1.2 * var(--u)); min-width: 0; align-self: stretch; }
  .counter .val { font-size: max(18px, calc(9 * var(--u))); line-height: 1; white-space: nowrap; transition: color .2s; }
  .counter .val small { font-size: .45em; color: var(--muted); margin-left: .1em; }
  .counter.nopips .val { font-size: max(22px, calc(12 * var(--u))); }
  .counter > .dbtn { --ds: calc(12.5 * var(--u)); width: calc(13.5 * var(--u)); align-self: stretch; }
  /* 점 배치는 최대치로 고정: 5개 이하는 한 줄, 그 이상은 두 줄(홀수면 아랫줄 가운데 정렬) */
  .pips {
    --pip: calc(3.4 * var(--u));
    --pgap: calc(2 * var(--u));
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: var(--pgap);
    width: calc(var(--pcols) * var(--pip) + (var(--pcols) - 1) * var(--pgap));
  }
  .pips i { flex: none; width: var(--pip); height: var(--pip); background: var(--surface-3); transform: rotate(45deg); transition: background .15s; }
  /* 3. 토큰 색 = 캐릭터 상징색 */
  .pips i.on { background: var(--cc, var(--pc)); }
  /* 강조 (캐릭터 색) */
  .counter.hi, .counter .grp.hi { background: color-mix(in srgb, var(--cc) 18%, var(--surface)); }
  .counter.hi .val, .counter .grp.hi .val { color: var(--cc); }
  .counter.hi .pips i.on { box-shadow: 0 0 calc(1.4 * var(--u)) var(--cc); }

  /* 두 종류 토큰 (타오) */
  .counter.dual { display: flex; flex-direction: column; align-items: stretch; padding: 0; gap: 1px; background: var(--line); }
  .counter .grp {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: auto auto minmax(0, 1fr) auto;
    align-items: center;
    gap: calc(1.2 * var(--u));
    padding: 0 calc(.6 * var(--u)) 0 calc(1.6 * var(--u));
    background: var(--surface);
    transition: background .2s;
  }
  .counter.dual .dbtn { --ds: calc(8.6 * var(--u)); width: calc(10.4 * var(--u)); align-self: stretch; }
  .counter .grp .tv { display: flex; align-items: baseline; gap: calc(1 * var(--u)); }
  /* 양/음 글자: 숫자와 같은 크기, 토큰 색 */
  .counter .grp .tl {
    font-family: var(--font-display);
    font-size: max(15px, calc(6 * var(--u)));
    line-height: 1;
    color: var(--tok);
  }
  /* 검은 글자는 어두운 배경에서 보이도록 밝은 외곽선 */
  .counter .grp .tl.dark {
    text-shadow: 1px 0 0 #C8CFE4, -1px 0 0 #C8CFE4, 0 1px 0 #C8CFE4, 0 -1px 0 #C8CFE4,
      1px 1px 0 #C8CFE4, -1px -1px 0 #C8CFE4, 1px -1px 0 #C8CFE4, -1px 1px 0 #C8CFE4;
  }
  .counter .grp .val { font-size: max(15px, calc(6 * var(--u))); min-width: 1.2ch; }
  .counter .grp .pips { --pip: calc(2.8 * var(--u)); --pgap: calc(1.6 * var(--u)); }
  .counter .grp .pipcell { align-self: stretch; display: grid; place-items: center; min-width: 0; }
  .counter .tap { cursor: pointer; border-radius: calc(1 * var(--u)); transition: background .1s; }
  .counter .tap:active { background: rgba(255, 255, 255, .08); }
  .counter .grp .pips i.on { background: var(--tok); box-shadow: 0 0 0 1px rgba(200, 207, 228, .7); }

  /* 하나만 켜는 상태 (리타) */
  .counter.stance {
    --sd: calc(18 * var(--u));
    display: grid;
    padding: 0;
    grid-template-columns: repeat(4, calc(var(--sd) / 2));
    grid-template-rows: repeat(3, calc(var(--sd) / 2));
    gap: 0 calc(1 * var(--u));
    justify-content: center;
    align-content: center;
  }
  .counter.stance .st:nth-child(1) { grid-area: 1 / 2 / span 2 / span 2; }
  .counter.stance .st:nth-child(2) { grid-area: 2 / 1 / span 2 / span 2; }
  .counter.stance .st:nth-child(3) { grid-area: 2 / 3 / span 2 / span 2; }
  .counter.stance .st {
    width: 100%;
    height: 100%;
    padding: calc(.4 * var(--u));
    box-sizing: border-box;
    background: var(--faint);
    display: grid;
    filter: grayscale(.85) brightness(.45);
    transition: filter .2s, background .2s;
  }
  .st .art { width: 100%; height: 100%; }
  .st .face-fb { font-size: calc(5 * var(--u)); }
  .counter.stance .st.on { filter: none; background: var(--cc); box-shadow: 0 0 calc(2 * var(--u)) var(--cc); }
  /* 선언한 상태: 흰 테두리 */
  .counter.stance .st.decl { filter: none; background: #fff; padding: calc(.9 * var(--u)); }
  .counter.stance .st.on:not(.decl) { padding: calc(.5 * var(--u)); }

  /* 특성 ON 강조: 토큰 강조(울프·비올라)와 같은 수준으로 은은하게 */
  .side.trait-on .trait { filter: drop-shadow(0 0 calc(.9 * var(--u)) color-mix(in srgb, var(--cc) 70%, transparent)); }
  /* 타오: 조화 중에 고른 쪽 = 토큰 강조와 같은 스타일 */
  .counter .grp.sel { background: color-mix(in srgb, var(--cc) 18%, var(--surface)); }
  .counter .grp.sel .val { color: var(--cc); }
  .counter.dual:not(.armed) .tap { cursor: default; }
  .counter.dual:not(.armed) .tap:active { background: none; }

  /* 가운데 열: 양쪽과 같은 줄(subgrid)을 씀
     1줄 이름판 = 툴바 · 2줄 체력 = 경기 시간(툴바 바로 아래) · 4줄 데미지/FP = 10초 타이머(FP와 같은 높이) · 5줄 특성 = TURN */
  .center {
    min-width: 0;
    grid-row: 1 / -1;
    display: grid;
    grid-template-rows: subgrid;
    justify-items: center;
  }
  .toolbar {
    grid-row: 1;
    align-self: start;
    justify-self: stretch;
    display: flex;
    gap: 1px;
    background: var(--line);
    --cut: calc(1.2 * var(--u));
  }
  .center .clock { grid-row: 2; align-self: start; }
  .center .dtimer { grid-row: 4; }
  .center .turnbtn { grid-row: 5; align-self: end; }
  .toolbar button {
    flex: 1 1 0;
    min-width: 0;
    height: calc(8.4 * var(--u));
    min-height: 30px;
    display: grid;
    place-items: center;
    background: var(--surface);
    color: var(--muted);
  }
  .toolbar button svg { width: 48%; height: 48%; }
  .toolbar button:active { background: var(--surface-2); color: var(--text); }
  .toolbar button.armed { background: var(--dmg); color: #fff; }
  .toolbar button[disabled] { color: var(--faint); cursor: default; }

  .clock { display: grid; justify-items: center; gap: calc(.4 * var(--u)); }
  .clock .num { font-size: max(15px, calc(5 * var(--u))); line-height: 1; letter-spacing: .04em; }
  .clock.paused .num { color: var(--muted); }
  .clock.over .num { color: var(--dmg); }
  /* 남은 시간 경고: 1분 이하 노랑, 10초 이하 빨강 (일시정지 중이면 같은 색을 흐리게) */
  .clock.min1 .num { color: var(--lumen); }
  .clock.sec10 .num { color: var(--dmg); }
  .clock.paused.min1 .num, .clock.paused.sec10 .num { opacity: .6; }

  .dtimer {
    position: relative;
    /* FP 칸(.ctrl)과 위아래를 맞춰 칸 전체를 채움(= 터치 영역).
       마름모는 SVG가 칸 안에 들어가는 가장 큰 정사각형으로 가운데에 그림 */
    margin-top: calc(.6 * var(--u));
    align-self: stretch;
    justify-self: stretch;
    min-height: 0;
    display: grid;
    place-items: center;
  }
  .dtimer svg.track { position: absolute; inset: 0; width: 100%; height: 100%; }
  .dtimer .bg { stroke: var(--surface-3); fill: rgba(19, 26, 43, .7); }
  .dtimer .inner { stroke: var(--line); fill: none; }
  .dtimer .fg { stroke: var(--lumen); fill: none; transition: stroke .2s; }
  .dtimer.warn .fg { stroke: var(--dmg); }
  .dtimer.idle .fg { stroke: var(--faint); }
  .dtimer .face { position: relative; display: grid; justify-items: center; gap: calc(.5 * var(--u)); pointer-events: none; }
  .dtimer .sec { font-size: calc(9.5 * var(--u)); line-height: .9; }
  .dtimer.warn .sec, .dtimer.done .sec { color: var(--dmg); }
  .dtimer.done .sec { animation: blink .35s steps(2) 4; }
  .dtimer > button.hit { position: absolute; inset: 0; }
  /* 서든데스 버튼: 양쪽 체력이 모두 0일 때만 10초 타이머 자리 전체(네모 영역)를 덮음 */
  .sdbtn { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; }
  .sdbtn[hidden] { display: none; }
  .sdbtn .sdshape { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sdbtn:active .sdshape { filter: brightness(.88); }
  .sdbtn .face { position: relative; display: grid; justify-items: center; gap: calc(.6 * var(--u)); color: var(--bg); }
  .sdbtn .t { font-family: var(--font-display); font-size: calc(5 * var(--u)); line-height: 1; }
  .sdbtn .s { font-family: var(--font-num); font-weight: 700; font-size: max(8px, calc(2 * var(--u))); letter-spacing: .06em; }

  .turnbtn {
    display: flex;

    gap: 1.4cqw;
    padding: calc(1.6 * var(--u)) 3cqw;

  }
  .turnbtn:active { background: var(--surface-2); }
  .turnbtn .lbl { font-family: var(--font-num); font-weight: 700; font-size: max(10px, calc(2.6 * var(--u))); letter-spacing: .16em; color: var(--muted); }
  .turnbtn .num { font-size: max(16px, calc(5.4 * var(--u))); line-height: 1; color: var(--lumen); }

  .toast {

  .log {
    position: absolute;
    inset: calc(6 * var(--u)) 24cqw;
    z-index: 5;

  }
  .log header {

  /* GAME LOG */

  .lclose { width: calc(8 * var(--u)); height: calc(8 * var(--u)); min-width: 30px; min-height: 30px; border-radius: calc(1.2 * var(--u)); color: var(--muted); font-size: max(15px, calc(4 * var(--u))); }
  .lclose:active { background: var(--surface-2); }
  .ltabs {
    display: flex;
    flex: none;
    gap: calc(1 * var(--u));

  }
  .ltab {
    flex: none;
    padding: .35em .8em;
    border-radius: calc(1 * var(--u));
    background: var(--surface-2);
    box-shadow: inset 0 0 0 1px var(--line);

  }
  .ltab { position: relative; overflow: hidden; touch-action: pan-x; }

  .ltab .fill { position: absolute; inset: 0; background: #fff; opacity: .35; transform: scaleX(0); transform-origin: left center; }
  .ltab.cur { color: var(--lumen); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--lumen) 45%, transparent); }
  .ltab.on { background: var(--lumen); color: #1A1300; box-shadow: none; }
  .llist {
    flex: 1;
    min-height: calc(20 * var(--u));
    overflow-y: auto;
    padding: calc(1.4 * var(--u));
    display: flex;
    flex-direction: column;
    gap: calc(.8 * var(--u));

  }

  .lrow.p1 { background: linear-gradient(to right, color-mix(in srgb, var(--p1) 12%, transparent), var(--surface-2) 60%); border-left-color: color-mix(in srgb, var(--p1) 55%, transparent); }
  .lrow.p2 { background: linear-gradient(to right, color-mix(in srgb, var(--p2) 12%, transparent), var(--surface-2) 60%); border-left-color: color-mix(in srgb, var(--p2) 55%, transparent); }
  .ltime { display: grid; color: var(--muted); font-size: max(10px, calc(2.5 * var(--u))); line-height: 1.25; }
  .ltime small { font-size: .85em; color: var(--faint); letter-spacing: .06em; }
  .laction { display: flex; align-items: center; flex-wrap: wrap; gap: calc(1.2 * var(--u)); min-width: 0; }

  .laction .tag {
    padding: .15em .6em;

  }
  .tag.minus { background: color-mix(in srgb, var(--dmg) 22%, transparent); color: #FFA69F; }

  .tag.start { background: color-mix(in srgb, var(--p1) 18%, transparent); color: #A9D2FF; }
  .tag.state { background: rgba(138, 147, 180, .18); color: var(--text); }
  .presses { font-family: var(--font-num); font-size: .8em; color: var(--muted); letter-spacing: .03em; }
  .lvalue { font-size: max(13px, calc(3.4 * var(--u))); white-space: nowrap; }
  /* 되돌린 줄: 흐리게 + 취소선, 다음 새 기록 때 사라짐 */
  .lrow.undone { opacity: .45; }
  .lrow.undone .tag, .lrow.undone .presses, .lrow.undone .lvalue { text-decoration: line-through; }
  .undid { font-size: .78em; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: calc(.8 * var(--u)); padding: .05em .5em; }
  .lvalue.neg { color: #FFA69F; }

  .lhint { flex: 1; min-width: 0; font-size: max(10px, calc(2.4 * var(--u))); color: var(--muted); word-break: keep-all; }
  .logpanel footer { display: flex; align-items: center; gap: calc(2 * var(--u)); justify-content: flex-end; padding: calc(1.2 * var(--u)) calc(2 * var(--u)); border-top: 1px solid var(--line); }
  .ldel {
    position: relative;
    overflow: hidden;
    padding: .5em 1.2em;
    border-radius: calc(1 * var(--u));
    background: var(--surface-2);
    box-shadow: inset 0 0 0 1px var(--line);
    font-family: var(--font-num);
    font-weight: 700;
    font-size: max(11px, calc(2.6 * var(--u)));
    letter-spacing: .06em;

    touch-action: none;
  }
  .ldel span { position: relative; }

  /* 설정 팝업 */
  .toolbar button.on { background: var(--surface-3); color: var(--lumen); }
  .settings .tabs { display: flex; gap: calc(.6 * var(--u)); }

    font-family: var(--font-display);
    font-size: max(13px, calc(3.8 * var(--u)));
    padding: .3em .8em;
    background: none;
    color: var(--muted);

  }
  .settings .tabs button.on { color: var(--text); box-shadow: inset 0 -2px 0 var(--lumen); }
  .setbody { overflow-y: auto; padding: calc(2.4 * var(--u)) 2.4cqw; display: grid; gap: calc(2.4 * var(--u)); align-content: start; }
  .setrow { display: flex; align-items: center; justify-content: space-between; gap: 2cqw; }
  .setrow b { display: block; font-size: max(13px, calc(3.6 * var(--u))); }

  .stepper { display: flex; align-items: center; gap: calc(1.4 * var(--u)); flex: none; }
  .stepper .dbtn { width: calc(11 * var(--u)); height: calc(11 * var(--u)); }

  .about { gap: calc(2.4 * var(--u)); }

  .about .brand b { display: block; font-family: var(--font-display); font-weight: 400; font-size: max(15px, calc(4.4 * var(--u))); }
  .about .brand small { display: block; margin-top: .2em; font-size: max(10px, calc(2.6 * var(--u))); color: var(--muted); }

  <div class="screen select" id="select" hidden></div>
  <div class="screen game" id="game" hidden></div>

<script>
(() => {
  // ================= 게임 데이터 =================
  // 캐릭터 추가: 아래 목록에 한 줄 추가 + assets/characters 폴더에 이미지 넣기.
  //   id    : 이미지 파일 이름 앞부분 (영문 소문자). 예) id 'wolf' → wolf_body.png / wolf_face.png / wolf_trait.png
  //   hp    : 시작 체력 (없으면 DEFAULT_HP)
  //   hands : 체력 구간별 최대 손패 [5000~4001, 4000~3001, 3000~2001, 2000~1001, 1000 이하]
  //   color : 캐릭터 상징색
  //   trait : 특성 이름,  autoTrait: 체력이 이 값 이하가 되면 특성 자동 ON (넘으면 OFF)
  //   traitHand: 특성 ON 동안 최대 패 매수에 더하는 수 (키메라 +1)
  //   counter: 하단 토큰 칸 (없으면 표시 안 함)
  //     { kind: 'count', label, start, max, hi }   max: null이면 상한 없음
  //        tapReset: true 이면 숫자나 마름모를 눌러 0으로 초기화
  //        spendOnTrait: true 이면 토큰이 최대일 때 특성을 켜는 순간 토큰을 모두 사용(0).
  //                      이때 칸 강조는 남겨 두고(p.spent), 특성 OFF 또는 토큰 개수가 바뀌면 꺼짐 (울프)
  //        hi: 강조 조건 'full'(최대치) | 'min1'(1개 이상) | 'zero'(0개)
  //     { kind: 'dual', labels: [a, b], start, max }  두 종류 토큰 (타오: 둘 다 최대면 조화 ON, 한쪽이라도 2 이하면 OFF)
  //     { kind: 'stance', states: [{ id, label }] }   하나만 켤 수 있는 상태 (리타). 특성 마크 = 전부 켜기(빛의 루멘)
  //   이미지: {id}_body / {id}_face / {id}_trait, stance 상태는 {id}_{상태id} (예: rita_guardian.png)
  const ASSET_DIR = 'assets/characters';
  const ASSET_EXTS = ['png', 'webp'];
  const DEFAULT_HP = 5000;
  const DEFAULT_HANDS = [6, 7, 8, 9, 9];
  const HAND_BANDS = [4000, 3000, 2000, 1000]; // 체력이 이 값 '초과'면 앞 구간
  const MIN_EMPTY_SLOTS = 3; // 선택 화면에 항상 남겨 둘 빈 칸 수 (추가 캐릭터 자리)
  const ROSTER_ROWS = 4;     // 역삼각형 줄 수 (캐릭터가 늘면 윗줄이 길어짐)
  const MERGE_MS = 1000;      // 이 시간 안에 같은 종류로 연속 입력하면 기록/되돌리기에서 한 번으로 묶음

  const CHARACTERS = [
    { id: 'nia', name: '니아', color: '#5BE37D' },
    { id: 'root', name: '루트', color: '#6CCBFF' },
    { id: 'delphi', name: '델피', color: '#19C2B0', counter: { kind: 'count', start: 3, max: 3 } },

  // ================= state =================
  const freshPlayer = () => ({ char: null, hp: DEFAULT_HP, maxHp: DEFAULT_HP, fp: 0, trait: false, counts: [0, 0], stance: null, sel: null, spent: false });
  const freshState = () => ({

  });
  let state = freshState();
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');

  } catch (e) {}
  // 저장된 캐릭터 값 정리 (예전 번호 → id). 목록에서 빠진 캐릭터면 선택 화면으로
  {
    const fixSnap = (sn) => { if (sn && sn.players) sn.players.forEach((x) => { x.char = normChar(x.char); }); };
    state.players.forEach((p) => { p.char = normChar(p.char); });

  }
  // 저장: 상태 전체(보관 로그 포함)를 JSON으로 쓰는 일이라 매 탭마다 하지 않고 잠깐 모았다가 한 번에 저장.
  // 앱이 백그라운드로 가거나 닫힐 때(visibilitychange/pagehide)는 바로 저장 → 경기 시간도 정확히 남음.
  let saveTimer = null;
  function saveNow() {
    clearTimeout(saveTimer);
    saveTimer = null;

    if (state.screen === 'game') state.lastGame = gameSnap();

  }
  const save = () => {

  function gameSnap() {
    return {
      players: state.players.map((p) => ({ char: p.char, hp: p.hp, maxHp: p.maxHp, fp: p.fp, trait: p.trait, counts: p.counts.slice(), stance: p.stance, sel: p.sel, spent: !!p.spent })),

      while (state.logArchive.length > LOG_ARCHIVE_MAX) state.logArchive.shift();

  function loadLog(v) {

      state.logArchive.splice(k, 1);

  const htmlCache = new WeakMap();

  // 지금 처리 중인 행동의 되돌리기 id. 이 행동 중에 남긴 로그 줄은 되돌리기 때 '되돌림'으로 표시됨
  let actionHid = null;
  function snapshot(label) {

    });

  }

    // 새 기록이 생기면 되돌린(흐리게 남겨 둔) 줄은 그때 지움
    if (state.log.some((r) => r.undone)) state.log = state.log.filter((r) => !r.undone);

  // 같은 key의 입력이 MERGE_MS 안에 이어지면 되돌리기 지점을 새로 만들지 않음 → true 반환
  function record(key, label) {
    const now = Date.now();
    const h = state.history[state.history.length - 1];
    if (h && h.key === key && now - h.t < MERGE_MS) { h.t = now; actionHid = h.id; return true; }

  }
  // 묶인 입력이면 마지막 기록 줄을 고치고, 아니면 새 줄

  function logEntry(merged, key, side, text, value, kind, press) {
    const row = merged ? state.log.find((r, n) => n < 6 && r.key === key && r.hid === actionHid) : null;

  // 역삼각형: 윗줄 W칸, 아래로 갈수록 한 칸씩 줄고 반 칸씩 들여써서 마름모가 맞물림
  function rosterLayout() {
    const need = CHARACTERS.length + MIN_EMPTY_SLOTS;
    const R = ROSTER_ROWS;
    const W = Math.max(R, Math.ceil((need + (R * (R - 1)) / 2) / R));
    const slots = [];
    let k = 0;
    for (let r = 0; r < R; r++) {
      for (let c = 0; c < W - r; c++) {
        slots.push({ c: k < CHARACTERS.length ? CHARACTERS[k] : null, col: 1 + r + c * 2, row: r + 1 });
        k++;
      }
    }
    return { W, slots };
  }

  function renderSelect() {

    const clearBtn = n == null

      : `<div class="selbadge p${n + 1}"><b>${n + 1}P</b><span>SELECT</span></div>`}${clearBtn}</div>`;
    setHtml($('select'), `
      ${fighterHtml(0)}
      <div class="pickcol">
        <div class="pickhead"><h1>CHARACTER SELECT</h1></div>
        <div class="seltools chamfer">
          <button data-a="log" aria-label="로그 보기">${I.log}</button>
          <button data-a="settings" aria-label="설정">${I.gear}</button>
        </div>
        <div class="roster" style="--cols:${W * 2};--w:${W}">${tiles}</div>
        <div class="startbar">${bottom}</div>
      </div>
      ${fighterHtml(1)}`);
  }

  // ================= 계산기 (골격 1회 생성 후 값만 갱신) =================
  function sideHtml(i) {
    const p = state.players[i];
    const c = charOf(p);
    const quick = QUICK.map((v) => `<button class="q num chamfer${v > 0 ? ' heal' : ''}" data-a="hp" data-p="${i}" data-v="${v}">${signed(v)}</button>`).join('');
    return `
      <div class="side p${i + 1}" id="side${i}">
        <div class="plate">
          <div class="facering dia">${faceArt(c, false).replace('class="art"', 'class="art dia"')}</div>
          <div class="who">
            <div class="line"><span class="ptag">${i + 1}P</span><span id="badges${i}"></span></div>
            <div class="cname">${esc(c.name)}</div>
          </div>
          <div class="hand"><span class="lbl">손패</span><b class="dia num" id="hand${i}">0</b></div>
        </div>
        <div class="hpline">
          <span class="hp num" id="hp${i}">0</span><span class="hpmax num" id="hpmax${i}"></span>
          <div class="burst num" id="burst${i}"><span class="amt"></span></div>
        </div>
        <div class="bar" id="bar${i}"><div class="ghost"></div><div class="fill"></div></div>
        <div class="ctrl">
          ${i === 0 ? `<div class="quick">${quick}</div>${fpHtml(i)}` : `${fpHtml(i)}<div class="quick">${quick}</div>`}
        </div>
        <div class="extras${c.counter ? '' : ' solo'}">
          ${i === 1 ? counterHtml(i, c) : ''}
          <button class="trait" id="trait${i}" style="--cc:${c.color}" data-a="trait" data-p="${i}" aria-pressed="false" aria-label="${i + 1}P ${esc(c.trait)} 켜기/끄기">
            <span class="mark dia"><span class="art dia"><span class="spark">${I.spark}</span>${artImg(c, 'trait')}</span></span>
          </button>
          ${i === 0 ? counterHtml(i, c) : ''}
        </div>
      </div>`;
  }

  const fpHtml = (i) => `
    <div class="fp chamfer">
      <button class="dbtn" data-a="fp" data-p="${i}" data-v="1" aria-label="${i + 1}P FP 증가">${I.plus}</button>
      <span class="val num" id="fp${i}" data-a="fpreset" data-p="${i}" role="button" aria-label="${i + 1}P FP 0으로 초기화">0</span>
      <button class="dbtn" data-a="fp" data-p="${i}" data-v="-1" aria-label="${i + 1}P FP 감소">${I.minus}</button>
    </div>`;
  const pipsHtml = (max, id) => (max && max <= 10
    ? `<span class="pips" id="${id}" style="--pcols:${max <= 5 ? max : Math.ceil(max / 2)}">${'<i></i>'.repeat(max)}</span>` : '');
  const stepBtns = (i, k, label) => [
    `<button class="dbtn" data-a="count" data-p="${i}" data-k="${k}" data-v="-1" aria-label="${i + 1}P ${esc(label)} 감소">${I.minus}</button>`,
    `<button class="dbtn" data-a="count" data-p="${i}" data-k="${k}" data-v="1" aria-label="${i + 1}P ${esc(label)} 증가">${I.plus}</button>`,
  ];
  const resetAttr = (i, k, ct) => (ct.tapReset
    ? ` data-a="creset" data-p="${i}" data-k="${k}" role="button" aria-label="${i + 1}P ${esc(ct.label || '토큰')} 0으로 초기화"`
    : '');
  const selAttr = (i, k, ct) => ` data-a="tsel" data-p="${i}" data-k="${k}" role="button" aria-label="${i + 1}P 조화 중 ${esc(ct.labels[k])} 선택"`;
  function counterHtml(i, c) {
    const ct = c.counter;
    if (!ct) return '';
    if (ct.kind === 'count') {
      const [minus, plus] = stepBtns(i, 0, ct.label || '토큰');
      return `
        <div class="counter chamfer${ct.max && ct.max <= 10 ? '' : ' nopips'}" id="ctr${i}" style="--cc:${c.color}">
          ${minus}
          <div class="mid${ct.tapReset ? ' tap' : ''}"${resetAttr(i, 0, ct)}><span class="val num" id="cv${i}_0">0</span>${pipsHtml(ct.max, `pips${i}_0`)}</div>
          ${plus}
        </div>`;
    }
    if (ct.kind === 'dual') {
      const grp = (k) => {
        const [minus, plus] = stepBtns(i, k, ct.labels[k]);
        return `
          <div class="grp" id="cg${i}_${k}" style="--tok:${ct.colors ? ct.colors[k] : 'var(--cc)'}">
            <span class="tv tap"${selAttr(i, k, ct)}><span class="tl${ct.dark && ct.dark[k] ? ' dark' : ''}">${esc(ct.labels[k])}</span><span class="val num" id="cv${i}_${k}">0</span></span>
            ${minus}
            <span class="pipcell tap"${selAttr(i, k, ct)}>${pipsHtml(ct.max, `pips${i}_${k}`)}</span>
            ${plus}
          </div>`;
      };
      return `<div class="counter dual chamfer" id="ctr${i}" style="--cc:${c.color}">${grp(0)}${grp(1)}</div>`;
    }
    if (ct.kind === 'stance') {
      return `
        <div class="counter stance chamfer" id="ctr${i}" style="--cc:${c.color}">
          ${ct.states.map((st) => `
            <button class="st dia" id="st${i}_${st.id}" data-a="stance" data-p="${i}" data-v="${st.id}" aria-pressed="false" aria-label="${i + 1}P ${esc(st.label)}">
              <span class="art dia"><span class="face-fb" style="--cc:${c.color}">${esc(st.label[0])}</span>${artImg(c, st.id)}</span>
            </button>`).join('')}
        </div>`;
    }
    return '';
  }

  // 강조 조건
  const HI = {
    full: (v, max) => max != null && v >= max,
    min1: (v) => v >= 1,
    zero: (v) => v === 0,
  };
  function updateCounter(i, p, c) {
    const ct = c.counter;
    if (!ct) return;
    const box = $('ctr' + i);
    const setVal = (k) => {
      // 두 종류 토큰은 칸이 좁아서 최대치는 점으로만 표시
      $(`cv${i}_${k}`).innerHTML = ct.max && ct.kind !== 'dual' ? `${p.counts[k]}<small>/${ct.max}</small>` : p.counts[k];
      const pips = $(`pips${i}_${k}`);
      if (pips) [...pips.children].forEach((dot, n) => dot.classList.toggle('on', n < p.counts[k]));
    };
    if (ct.kind === 'count') {
      setVal(0);
      box.classList.toggle('hi', !!p.spent || (!!ct.hi && HI[ct.hi](p.counts[0], ct.max)));
    } else if (ct.kind === 'dual') {
      setVal(0); setVal(1);
      // 조화 상태가 아닐 때 더 많은 쪽 강조
      const [a, b] = p.counts;
      $(`cg${i}_0`).classList.toggle('hi', !p.trait && a > b);
      $(`cg${i}_1`).classList.toggle('hi', !p.trait && b > a);
      // 조화 중: 고른 쪽 강조
      [0, 1].forEach((k) => $(`cg${i}_${k}`).classList.toggle('sel', !!p.trait && p.sel === k));
      box.classList.toggle('armed', !!p.trait);
    } else if (ct.kind === 'stance') {
      box.classList.toggle('hi', !!p.trait);
      ct.states.forEach((st) => {
        // 빛의 루멘이면 셋 다 적용(켜짐), 선언한 상태는 흰 테두리
        const on = p.trait || p.stance === st.id;
        const el = $(`st${i}_${st.id}`);
        el.classList.toggle('on', on);
        el.classList.toggle('decl', p.stance === st.id);
        el.setAttribute('aria-pressed', String(on));
      });
    }
  }

  function buildGame() {
    $('game').innerHTML = `
      ${sideHtml(0)}
      <div class="center">
        <div class="toolbar chamfer">
          <button data-a="reselect" id="tb-reselect" aria-label="캐릭터 다시 선택">${I.user}</button>
          <button data-a="reset" id="tb-reset" aria-label="새 게임">${I.reset}</button>
          <button data-a="settings" id="tb-settings" aria-label="설정">${I.gear}</button>
          <button data-a="log" aria-label="기록 보기">${I.log}</button>
          <button data-a="undo" id="tb-undo" aria-label="되돌리기">${I.undo}</button>
        </div>
        <button class="clock" id="clock" data-a="clock" data-long="clockReset">
          <span class="num" id="clockNum">30:00</span>
        </button>
        <div class="dtimer idle" id="dtimer">
          <svg class="track" viewBox="0 0 100 100" aria-hidden="true">
            <polygon class="bg" points="50,3 97,50 50,97 3,50" stroke-width="1"/>
            <polygon class="inner" points="50,14 86,50 50,86 14,50" stroke-width=".6"/>
            <polygon class="fg" id="dtFg" points="50,3 97,50 50,97 3,50" stroke-width="3.2" stroke-linejoin="round"
              pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/>
          </svg>
          <button class="hit" data-a="round" data-long="roundStop" aria-label="10초 타이머 시작, 길게 눌러 정지"></button>
          <div class="face">
            <span class="sec num" id="dtSec">${ROUND_SECONDS}</span>          </div>
          <button class="sdbtn" id="sdBtn" data-a="sudden" hidden aria-label="서든데스 시작">
            <svg class="sdshape" viewBox="0 0 100 100" aria-hidden="true">
              <defs><linearGradient id="sdGrad" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#FFD978"/><stop offset=".55" stop-color="#FFC247"/><stop offset="1" stop-color="#E29A1E"/></linearGradient></defs>
              <polygon points="50,0 100,50 50,100 0,50" fill="url(#sdGrad)"/>
            </svg>
            <span class="face"><span class="t">서든데스</span><span class="s num">HP ${SUDDEN_DEATH_HP} · FP 0</span></span>
          </button>
        </div>
        <button class="turnbtn chamfer" id="turnBtn" data-a="turn" data-long="turnDown" aria-label="턴 +1, 길게 눌러 −1">
          <span class="lbl" id="turnLbl">TURN</span><span class="num" id="turnNum">1</span>
        </button>
      </div>
      ${sideHtml(1)}`;
    barPrev[0] = barPrev[1] = null;
  }

  const barPrev = [null, null];
  function updateGame() {
    state.players.forEach((p, i) => {
      const c = charOf(p);
      const pct = p.maxHp ? Math.max(0, Math.min(100, (p.hp / p.maxHp) * 100)) : 0;
      $('hp' + i).textContent = p.hp;
      $('hpmax' + i).textContent = '/' + p.maxHp;
      $('hand' + i).textContent = handLimit(p);
      $('side' + i).classList.toggle('ko', p.hp <= 0);
      $('side' + i).classList.toggle('trait-on', !!p.trait);
      const bar = $('bar' + i);
      bar.classList.toggle('low', pct <= 40 && pct > 20);
      bar.classList.toggle('crit', pct <= 20);
      const fill = bar.querySelector('.fill'), ghost = bar.querySelector('.ghost');
      if (barPrev[i] == null) {
        ghost.style.transition = fill.style.transition = 'none';
        fill.style.width = ghost.style.width = pct + '%';
        void bar.offsetWidth;
        ghost.style.transition = fill.style.transition = '';
      } else if (pct !== barPrev[i]) {
        // 피해는 흰 잔상이 늦게 따라오고, 회복은 잔상 없이 바로 채움
        ghost.style.transition = pct > barPrev[i] ? 'none' : '';
        fill.style.width = ghost.style.width = pct + '%';
      }
      barPrev[i] = pct;

      const fp = $('fp' + i);
      fp.textContent = signed(p.fp);
      fp.className = 'val num' + (p.fp > 0 ? ' pos' : p.fp < 0 ? ' neg' : '');
      const trait = $('trait' + i);
      trait.classList.toggle('on', p.trait);
      trait.setAttribute('aria-pressed', String(p.trait));
      updateCounter(i, p, c);
      $('badges' + i).innerHTML = p.hp <= 0 ? '<span class="badge ko">K.O.</span>' : '';

      const b = ui.burst[i];
      const bEl = $('burst' + i);
      const live = b && Date.now() - b.t < BURST_MS;
      bEl.className = 'burst num' + (b ? (b.amt < 0 ? ' dmg' : ' heal') : '') + (live ? ' show' : '');
      if (live) {
        bEl.querySelector('.amt').textContent = signed(b.amt);
      }
    });

    $('turnNum').textContent = state.turn;
    $('turnLbl').textContent = state.sudden ? 'SUDDEN' : 'TURN';
    $('turnBtn').classList.toggle('sd', state.sudden);
    $('sdBtn').hidden = !bothKo();
    $('tb-undo').disabled = !state.history.length;
    $('tb-reset').classList.toggle('armed', ui.armed === 'reset');
    $('tb-reselect').classList.toggle('armed', ui.armed === 'reselect');
    $('tb-settings').classList.toggle('on', ui.settingsOpen);
    updateClock();
    updateTimer10();
  }
  function renderOverlays() {
    const toast = $('toast');
    toast.hidden = !ui.toast;
    toast.textContent = ui.toast;
    renderLog();
    renderSettings();
  }

  function updateClock() {
    const el = $('clock');
    if (!el) return;
    const left = timeLeft();
    $('clockNum').textContent = fmtClock(left);
    el.classList.toggle('paused', !state.timer.since && left > 0);
    el.classList.toggle('over', left <= 0);
    // 남은 1분부터 노랑, 10초부터 빨강
    el.classList.toggle('min1', left > 10 && left <= 60);
    el.classList.toggle('sec10', left > 0 && left <= 10);
    if (state.timer.since && left <= 0) { state.timer = { left: 0, since: null }; saveNow(); buzz([300, 100, 300]); }
  }

  // 10초 타이머
  function roundLeft() {
    const r = ui.round;
    return r.end ? Math.max(0, (r.end - Date.now()) / 1000) : (r.done ? 0 : ROUND_SECONDS);
  }
  function updateTimer10() {
    const box = $('dtimer');
    if (!box) return;
    const r = ui.round;
    const left = roundLeft();
    if (r.end && left <= 0) { r.end = null; r.done = true; buzz([200, 80, 200]); }
    $('dtSec').textContent = Math.ceil(left);
    $('dtFg').style.strokeDashoffset = String(100 * (1 - left / ROUND_SECONDS));
    box.classList.toggle('idle', !r.end && !r.done);
    box.classList.toggle('warn', !!r.end && left <= 3);
    box.classList.toggle('done', r.done);
  }
  let timerLooping = false;
  function timerLoop() {
    updateTimer10();
    if (ui.round.end) requestAnimationFrame(timerLoop); else timerLooping = false;
  }
  function startTimerLoop() {
    if (timerLooping) return;
    timerLooping = true;
    requestAnimationFrame(timerLoop);
  }

  // ---------- GAME LOG (Digimon Memory Checker 로그와 같은 구성) ----------
  function logRowHtml(r) {
    const side = r.side != null ? ` p${r.side + 1}` : '';
    const who = r.side != null ? `<span class="who">${r.side + 1}P</span>` : '';
    const net = r.presses ? r.presses.reduce((a, b) => a + b, 0) : null;
    let tag;
    let tagCls = 'state';
    if (r.kind === 'dmg' || r.kind === 'heal') { tag = `${r.text} ${signed(net)}`; tagCls = r.kind === 'dmg' ? 'minus' : 'plus'; }
    else if (r.kind === 'fp') { tag = `FP ${signed(net)}`; tagCls = 'fp'; }
    else if (r.kind === 'fpr') { tag = r.text; tagCls = 'fp'; }
    else if (r.kind === 'count') { tag = `${r.text} ${signed(net)}`; tagCls = 'token'; }
    else if (r.kind === 'turn') { tag = r.text; tagCls = 'turn'; }
    else if (r.kind === 'start') { tag = r.text; tagCls = 'start'; }
    else tag = r.text;
    const presses = r.presses && r.presses.length > 1 ? `<span class="presses">${r.presses.map(signed).join(' · ')}</span>` : '';
    const valCls = r.kind === 'dmg' ? ' neg' : r.kind === 'heal' ? ' pos' : '';
    return `
      <div class="lrow${side}${r.undone ? ' undone' : ''}">
        <div class="ltime num">${r.t ? fmtTime(r.t) : '--:--:--'}<small>T${r.turn}</small></div>
        <div class="laction">${who}<span class="tag ${tagCls}">${esc(tag)}</span>${presses}${r.undone ? '<span class="undid">되돌림</span>' : ''}</div>
        <div class="lvalue num${valCls}">${r.value != null ? esc(r.value) : '—'}</div>
      </div>`;
  }
  function renderLog() {
    const el = $('log');
    el.hidden = !ui.logOpen;
    if (!ui.logOpen) { htmlCache.delete(el); return; }
    const arcs = state.logArchive;
    if (ui.logView !== 'current' && !arcs[Number(ui.logView)]) ui.logView = 'current';
    let tabs = `<button class="ltab cur${ui.logView === 'current' ? ' on' : ''}" data-a="lview" data-hold="logload" data-v="current"><i class="fill"></i><span>● ${esc(state.logName || 'NEW')}</span></button>`;
    for (let k = arcs.length - 1; k >= 0; k--) {
      tabs += `<button class="ltab${ui.logView === String(k) ? ' on' : ''}" data-a="lview" data-hold="logload" data-v="${k}"><i class="fill"></i><span>${esc(arcs[k].name)}</span></button>`;
    }
    const entries = ui.logView === 'current' ? state.log : arcs[Number(ui.logView)].entries;
    const rows = entries.map(logRowHtml).join('');
    const html = `
      <div class="logpanel">
        <header><b>GAME LOG</b><button class="lclose" data-a="log" aria-label="닫기">✕</button></header>
        <nav class="ltabs">${tabs}</nav>
        <div class="llist">${rows || '<div class="lempty">아직 기록이 없어요.</div>'}</div>
        <footer><span class="lhint">로그 이름을 1초 누르면 그 게임의 마지막 상황을 불러와요</span><button class="ldel" data-hold="logdel"><i class="fill"></i><span>ALL DELETE</span></button></footer>
      </div>`;
    setHtml(el, html); // 내용이 바뀔 때만 다시 그림 (스크롤 위치·길게 누르기 유지)
  }
  // ALL DELETE: 1초 길게 눌러 모든 로그(현재 + 보관함)와 되돌리기 기록 삭제
  function deleteAllLogs() {
    state.log = [];
    state.logArchive = [];
    state.history = [];
    state.logName = null;
    state.lastGame = null;
    state.screen = 'select';
    clearPicks();
    Object.assign(ui, { logView: 'current', logOpen: false, settingsOpen: false, armed: null, burst: [null, null], round: { end: null, done: false } });
    flashToast('모든 로그 삭제 · 새 게임을 시작하세요', 2200);
    buzz(15);
    show();
  }
  (() => {
    // 완료 판정은 타이머로, 채워지는 막대만 화면 프레임으로 그림
    let raf = null, timer = null, start = 0, btn = null, sx = 0, sy = 0;
    const paint = (pct) => { const f = btn && btn.querySelector('.fill'); if (f) f.style.transform = `scaleX(${pct})`; };
    const end = () => {
      if (raf) cancelAnimationFrame(raf);
      clearTimeout(timer);
      raf = timer = null;
      paint(0);
      btn = null;
    };
    const tick = () => { paint(Math.min(1, (Date.now() - start) / DELETE_HOLD_MS)); raf = requestAnimationFrame(tick); };
    document.addEventListener('pointerdown', (e) => {
      const b = e.target.closest('[data-hold]');
      if (!b) return;
      if (b.dataset.hold === 'logdel') e.preventDefault();
      btn = b;
      start = Date.now();
      sx = e.clientX; sy = e.clientY;
      buzz(4);
      raf = requestAnimationFrame(tick);
      timer = setTimeout(() => {
        const kind = b.dataset.hold, v = b.dataset.v;
        end();
        holdFired = true; // 손을 뗄 때 생기는 클릭(탭 보기)은 무시
        if (kind === 'logdel') deleteAllLogs(); else if (kind === 'logload') loadLog(v);
      }, DELETE_HOLD_MS);
    });
    ['pointerup', 'pointercancel'].forEach((t) => document.addEventListener(t, () => { if (btn) end(); }));
    // 탭을 누른 채 옆으로 스크롤하면 취소
    document.addEventListener('pointermove', (e) => { if (btn && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) end(); });
  })();
  let holdFired = false;
  let toastTimer = null;
  function flashToast(msg, ms = 1200) {
    ui.toast = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { if (ui.toast === msg) { ui.toast = ''; refresh(); } }, ms);
  }

  const HELP = [
    ['캐릭터 선택', ['처음 누른 캐릭터가 1P, 두 번째로 누른 캐릭터가 2P가 돼요. 같은 캐릭터를 두 번 누르면 미러전이에요.',

  function renderSettings() {
    const el = $('settings');
    el.hidden = !ui.settingsOpen;
    if (!ui.settingsOpen) { htmlCache.delete(el); return; }
    const mins = Math.round(state.matchSeconds / 60);
    const tab = ui.settingsTab;
    const body = tab === 'settings' ? `
      <div class="setbody">
        <div class="setrow">
          <div><b>경기 시간</b><small>바꾸면 바로 적용돼요. 이미 지난 시간은 그대로 두고 남은 시간이 늘거나 줄어요.</small></div>
          <div class="stepper">
            <button class="dbtn" data-a="mtime" data-v="-1" aria-label="경기 시간 1분 줄이기">${I.minus}</button>
            <span class="num"><output>${mins}</output>분</span>
            <button class="dbtn" data-a="mtime" data-v="1" aria-label="경기 시간 1분 늘리기">${I.plus}</button>
          </div>
        </div>
        <div class="presets">${[20, 25, 30, 40, 50, 60].map((m) => `<button class="chamfer${m === mins ? ' on' : ''}" data-a="mtime" data-set="${m}">${m}분</button>`).join('')}</div>
        <div class="setrow now"><span>남은 경기 시간</span><b class="num">${fmtClock(timeLeft())}</b></div>
      </div>` : tab === 'about' ? `
      <div class="setbody about">
        <div class="brand"><span class="mk dia"></span><div><b>${esc(APP.name)}</b><small>오프라인 대전용 체력 · 토큰 계산기</small></div></div>
        <dl>
          <div><dt>버전</dt><dd class="num">${esc(APP.version)}</dd></div>
          <div><dt>빌드 날짜</dt><dd class="num">${esc(APP.build)}</dd></div>
        </dl>
        <p class="note">루멘콘덴서는 야오니코믹이 개발하고 대원미디어가 유통하는 카드게임이에요. 이 앱은 플레이를 돕기 위해 만든 비공식 도구예요.</p>
      </div>` : `
      <div class="setbody help">${HELP.map(([h, items]) => `<section><h4>${h}</h4><ul>${items.map((t) => `<li>${esc(t)}</li>`).join('')}</ul></section>`).join('')}</div>`;
    setHtml(el, `
      <header>
        <nav class="tabs">
          <button class="${tab === 'settings' ? 'on' : ''}" data-a="stab" data-v="settings">설정</button>
          <button class="${tab === 'help' ? 'on' : ''}" data-a="stab" data-v="help">사용법</button>
          <button class="${tab === 'about' ? 'on' : ''}" data-a="stab" data-v="about">버전</button>
        </nav>
        <button data-a="settings">닫기</button>
      </header>
      ${body}`);
  }

  // ================= 화면 전환 =================
  function show() {
    $('select').hidden = state.screen !== 'select';
    $('game').hidden = state.screen !== 'game';
    if (state.screen === 'select') renderSelect();
    else { buildGame(); updateGame(); }
    renderOverlays();
    save();
  }
  function refresh() {
    if (state.screen === 'select') renderSelect();
    else updateGame();
    renderOverlays();
    save();
  }

  function startGame() {
    state.players.forEach((p) => {
      p.hp = p.maxHp = charOf(p).hp;
      const ct = charOf(p).counter;
      p.fp = 0; p.trait = false; p.stance = null; p.sel = null; p.spent = false;
      p.counts = ct && ct.start ? [ct.start, ct.kind === 'dual' ? ct.start : 0] : [0, 0];
    });
    archiveCurrent();
    Object.assign(state, { screen: 'game', turn: 1, sudden: false, history: [], log: [], logName: fmtArchiveName(new Date()), timer: { left: state.matchSeconds, since: null } });
    ui.logView = 'current';
    ui.burst = [null, null];
    ui.armed = null; ui.toast = ''; ui.logOpen = false; ui.settingsOpen = false;
    ui.round = { end: null, done: false };
    const [a, b] = state.players;
    addLog(null, `게임 시작 · ${charOf(a).name} vs ${charOf(b).name}`, `${a.hp} / ${b.hp}`, 'start');
    addLog(null, '턴 1 시작', null, 'turn');
    show();
    requestWakeLock();
  }

  // ================= 두 번 눌러 확인 =================
  let armTimer = null;
  function twoStep(key, msg, fn) {
    clearTimeout(armTimer);
    if (ui.armed === key) {
      ui.armed = null; ui.toast = '';
      fn();
      return true;
    }
    ui.armed = key;
    ui.toast = msg;
    armTimer = setTimeout(() => { ui.armed = null; ui.toast = ''; refresh(); }, 2500);
    return false;
  }

  // ================= actions =================
  const burstTimers = [null, null];
  const actions = {
    pick(_, v) {
      const n = nextPick();
      // 둘 다 고른 상태: 고른 캐릭터를 다시 누르면 그쪽 선택 취소(미러전이면 2P부터), 다른 칸은 무시
      if (n == null) {
        const [a, b] = state.players;
        if (b.char === v) b.char = null;
        else if (a.char === v) a.char = null;
        return;
      }
      state.players[n].char = v;
    },
    unpick(i) { state.players[i].char = null; },
    unpickAll() { clearPicks(); },
    start() {
      if (state.players.every((p) => p.char != null)) { startGame(); return 'shown'; }
    },
    hp(i, v) {
      const p = state.players[i];
      const d = Number(v);
      const next = Math.max(0, Math.min(p.maxHp, p.hp + d));
      if (next === p.hp) return;
      const key = `hp${i}${d < 0 ? '-' : '+'}`;
      const merged = record(key, `${i + 1}P ${d < 0 ? '피해' : '회복'}`);
      const real = next - p.hp;
      const beforeHp = p.hp;
      p.hp = next;
      logEntry(merged, key, i, d < 0 ? '피해' : '회복', p.hp, d < 0 ? 'dmg' : 'heal', real);
      autoTrait(i, beforeHp);
      const now = Date.now();
      const b = ui.burst[i];
      const same = b && (b.amt < 0) === (real < 0) && now - b.t < BURST_MS;
      ui.burst[i] = same ? { amt: b.amt + real, t: now } : { amt: real, t: now };
      clearTimeout(burstTimers[i]);
      burstTimers[i] = setTimeout(refresh, BURST_MS + 20);
    },
    fp(i, v) {
      const merged = record(`fp${i}`, `${i + 1}P FP`);
      state.players[i].fp += Number(v);
      logEntry(merged, `fp${i}`, i, 'FP', signed(state.players[i].fp), 'fp', Number(v));
    },
    // 현재 FP 숫자 탭 → 0 (되돌리기 한 번, 로그 "FP 초기화 (±n)")
    fpreset(i) {
      const p = state.players[i];
      if (!p.fp) return;
      snapshot(`${i + 1}P FP 초기화`);
      addLog(i, `FP 초기화 (${signed(p.fp)})`, '0', 'fpr');
      p.fp = 0;
    },
    trait(i) {
      const p = state.players[i];
      const c = charOf(p);
      const kind = c.counter && c.counter.kind;
      if (kind === 'dual') {
        // 타오: 조화는 토큰으로만 켜짐. 조화 중에 누르면 토큰 모두 제거 → 조화 OFF
        if (!p.trait) return;
        snapshot(`${i + 1}P ${c.trait} 해제`);
        p.counts = [0, 0];
        p.trait = false;
        p.sel = null;
        addLog(i, `${c.trait} 해제 · 토큰 모두 제거`, '0 / 0', '');
        return;
      }
      snapshot(`${i + 1}P ${c.trait}`);
      p.trait = !p.trait;
      const ct = c.counter;
      if (!p.trait) p.spent = false;
      if (p.trait && ct && ct.spendOnTrait && ct.max && p.counts[0] >= ct.max) {
        p.counts[0] = 0;
        p.spent = true; // 토큰을 다 쓴 뒤에도 강조 유지 (특성 OFF나 토큰 변동 시 꺼짐)
        addLog(i, `${ct.label || '토큰'} 모두 사용`, `0/${ct.max}`, '');
      }
      // 리타: 빛의 루멘은 세 상태를 모두 적용. 선언한 상태(p.stance)는 그대로 유지
      addLog(i, c.trait, p.trait ? 'ON' : 'OFF', '');
    },
    count(i, v, d) {
      const p = state.players[i];
      const c = charOf(p);
      const ct = c.counter;
      if (!ct) return;
      const k = Number(d.k || 0);
      const raw = p.counts[k] + Number(v);
      const next = Math.max(0, ct.max ? Math.min(ct.max, raw) : raw);
      if (next === p.counts[k]) return;
      const label = ct.kind === 'dual' ? ct.labels[k] : (ct.label || '토큰');
      const merged = record(`ct${i}_${k}`, `${i + 1}P ${label}`);
      const press = next - p.counts[k];
      p.counts[k] = next;
      p.spent = false;
      logEntry(merged, `ct${i}_${k}`, i, label, ct.max ? `${next}/${ct.max}` : next, 'count', press);
      if (ct.kind === 'dual') {
        // 타오 조화: 둘 다 최대면 ON, 한쪽이라도 2개 이하가 되면 OFF
        const [a, b] = p.counts;
        const before = p.trait;
        if (a >= ct.max && b >= ct.max) p.trait = true;
        else if (a <= 2 || b <= 2) p.trait = false;
        if (!p.trait) p.sel = null;
        if (p.trait !== before) addLog(i, c.trait, p.trait ? 'ON' : 'OFF', '');
      }
    },
    // 타오: 조화 상태에서 양/음 중 하나 선택
    tsel(i, v, d) {
      const p = state.players[i];
      const c = charOf(p);
      if (!p.trait || !c.counter || c.counter.kind !== 'dual') return;
      const k = Number(d.k || 0);
      snapshot(`${i + 1}P ${c.counter.labels[k]} 선택`);
      p.sel = p.sel === k ? null : k;
      addLog(i, `${c.trait} · ${c.counter.labels[k]}`, p.sel === k ? '선택' : '해제', '');
    },
    creset(i, v, d) {
      const p = state.players[i];
      const c = charOf(p);
      const ct = c.counter;
      const k = Number(d.k || 0);
      if (!ct || !ct.tapReset || p.counts[k] === 0) return;
      const label = ct.label || '토큰';
      snapshot(`${i + 1}P ${label} 초기화`);
      p.counts[k] = 0;
      addLog(i, `${label} 초기화`, ct.max ? `0/${ct.max}` : 0, '');
    },
    stance(i, v) {
      const p = state.players[i];
      const c = charOf(p);
      const st = c.counter.states.find((x) => x.id === v);
      snapshot(`${i + 1}P ${st.label}`);
      p.stance = p.stance === v ? null : v;
      // 빛의 루멘 중에도 하나를 선언할 수 있음 (루멘은 유지)
      addLog(i, p.trait ? `${st.label} 선언` : st.label, p.stance === v ? 'ON' : 'OFF', '');
    },
    // 서든데스 버튼: 양쪽 체력 1000 · FP 0 (되돌리기 가능)
    sudden() {
      if (!bothKo()) return;
      snapshot('서든데스');
      state.players.forEach((p, i) => { const before = p.hp; p.hp = SUDDEN_DEATH_HP; p.fp = 0; autoTrait(i, before); });
      state.sudden = true;
      ui.burst = [null, null];
      addLog(null, `서든데스 → 양쪽 체력 ${SUDDEN_DEATH_HP} · FP 0`, null, 'turn');
      buzz(40);
    },
    turn(_, v) {
      const d = Number(v || 1);
      if (state.turn + d < 1) return;
      snapshot('턴');
      state.turn += d;
      addLog(null, d > 0 ? `턴 ${state.turn} 시작` : `턴 ${state.turn}로 되돌림`, null, 'turn');
    },
    turnDown() { actions.turn(null, -1); },
    round() {
      ui.round = { end: Date.now() + ROUND_SECONDS * 1000, done: false };
      startTimerLoop();
    },
    roundStop() { ui.round = { end: null, done: false }; },
    clock() {
      const left = timeLeft();
      if (left <= 0) return;
      state.timer = state.timer.since ? { left, since: null } : { left, since: Date.now() };
    },
    clockReset() { state.timer = { left: state.matchSeconds, since: null }; },
    settings() { ui.settingsOpen = !ui.settingsOpen; ui.logOpen = false; },
    stab(_, v) { ui.settingsTab = v; },
    // 경기 시간 변경: 이미 흐른 시간은 유지하고 남은 시간만 늘리거나 줄임 (바로 적용)
    mtime(_, v, d) {
      const mins = d.set ? Number(d.set) : Math.round(state.matchSeconds / 60) + Number(v);
      const next = Math.max(1, Math.min(99, mins)) * 60;
      const diff = next - state.matchSeconds;
      if (!diff) return;
      const left = timeLeft();
      state.matchSeconds = next;
      const newLeft = Math.max(0, left + diff);
      state.timer = state.timer.since ? { left: newLeft, since: Date.now() } : { left: newLeft, since: null };
      if (state.screen === 'game') addLog(null, '경기 시간 변경', `${next / 60}분`, '');
    },
    undo() {
      const h = state.history.pop();
      if (!h) return;
      state.turn = h.turn; state.sudden = h.sudden;
      h.players.forEach((s, i) => Object.assign(state.players[i], s));
      // 되돌린 직후 입력이 그 이전 묶음에 합쳐지지 않도록
      const prev = state.history[state.history.length - 1];
      if (prev) prev.t = 0;
      ui.burst = [null, null];
      // 되돌린 줄은 바로 지우지 않고 흐리게 남김 → 다음 새 기록이 생길 때 지워짐
      state.log.forEach((r) => { if (r.hid === h.id) r.undone = true; });
      flashToast(`되돌리기 · ${h.label}`);
    },
    log() { ui.logOpen = !ui.logOpen; ui.settingsOpen = false; ui.logView = 'current'; },
    logbg() { ui.logOpen = false; },
    lview(_, v) { ui.logView = v; },
    reset() {
      if (twoStep('reset', '한 번 더 누르면 같은 캐릭터로 새 게임', startGame)) return 'shown';
    },
    reselect() {
      const done = twoStep('reselect', '한 번 더 누르면 캐릭터 선택으로', () => {
        state.screen = 'select';
        clearPicks(); // 캐릭터 선택으로 돌아가면 1P·2P 모두 비움
        ui.round = { end: null, done: false };
        show();
      });
      if (done) return 'shown';
    },
  };

  // 체력이 기준을 넘나들 때만 특성을 자동으로 켜고 끔 (그 사이 수동 조작은 유지)
  function autoTrait(i, before) {
    const p = state.players[i];
    const c = charOf(p);
    if (!c || c.autoTrait == null) return;
    const lim = c.autoTrait;
    if (before > lim && p.hp <= lim && !p.trait) { p.trait = true; addLog(i, c.trait, `ON (체력 ${lim} 이하)`, ''); }
    else if (before <= lim && p.hp > lim && p.trait) { p.trait = false; addLog(i, c.trait, `OFF (체력 ${lim} 초과)`, ''); }
  }

  // 양쪽 체력이 모두 0이면 가운데에 서든데스 버튼이 나타남 (자동으로 넘어가지 않음)
  const bothKo = () => state.screen === 'game' && state.players.every((p) => p.hp <= 0);

  // ================= 입력 =================
  let longTimer = null, longFired = false;
  document.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('[data-long]');
    longFired = false;
    clearTimeout(longTimer);
    if (!el) return;
    longTimer = setTimeout(() => {
      longFired = true;
      const fn = actions[el.dataset.long];
      actionHid = null;
      if (fn) { fn(); refresh(); buzz(30); }
    }, 550);
  });
  ['pointerup', 'pointercancel'].forEach((t) => document.addEventListener(t, () => clearTimeout(longTimer)));
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  document.addEventListener('click', (e) => {
    if (holdFired) { holdFired = false; if (e.target.closest('[data-hold]')) return; }
    const btn = e.target.closest('[data-a]');
    if (!btn || btn.disabled) return;
    if (longFired && btn.dataset.long) { longFired = false; return; }
    const fn = actions[btn.dataset.a];
    if (!fn) return;
    if (btn.dataset.a === 'logbg' && e.target !== btn) return; // 패널 안쪽은 닫지 않음
    const i = btn.dataset.p != null ? Number(btn.dataset.p) : null;
    actionHid = null;
    const r = fn(i, btn.dataset.v, btn.dataset);
    if (r !== 'shown') refresh();
  });

  setInterval(() => { if (state.screen === 'game' && state.timer.since) updateClock(); }, 250);

  // ================= 화면 꺼짐 방지 =================
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { if (state.screen === 'game') requestWakeLock(); }
    else saveNow();
  });
  addEventListener('pagehide', saveNow);

  if (state.screen === 'game') {
    archiveCurrent();
    Object.assign(state, { screen: 'select', history: [], logName: null });
    flashToast('지난 게임은 로그에 보관됐어요 · 로그 이름을 1초 눌러 이어하기', 3500);
  }
  // 앱을 켤 때마다 캐릭터 선택은 빈 상태에서 시작
  clearPicks();
  show();
  saveNow();
})();
</script>
